<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login | Precision Farming</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="auth-body">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Precision Farming System</p>

        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

          <button type="submit">Login</button>
        </form>

        <span class="auth-error" id="error"></span>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>

  </body>
</html>
